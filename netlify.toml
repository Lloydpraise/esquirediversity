# Netlify build settings. Netlify reads this file automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects live in public/_redirects (copied into dist/ on build).

# Long cache for fingerprinted assets Astro generates.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
